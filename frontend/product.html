<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Zak Store</title>
<meta name="theme-color" content="#07070f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link id="bs-ltr" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" disabled>
<link id="bs-rtl" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="assets/css/app.css?v=12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%80%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="aurora" aria-hidden="true"><span></span><span></span><span></span><i class="grid-veil"></i></div>
<div class="motes" id="motes" aria-hidden="true"></div>

<header class="zs-nav">
  <div class="shell nav-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" id="logoMark">🚀</span>
      <span class="brand-text">
        <span id="brandName">Zak Store</span>
        <small id="brandTagline"></small>
      </span>
    </a>
    <div class="lang-toggle" style="margin-inline-start:auto">
      <span class="glider"></span>
      <button data-lang="ar" class="on">عربي</button>
      <button data-lang="en">EN</button>
    </div>
    <a href="account.html" class="btn-ghost" style="padding:10px 18px;font-size:.85rem" id="acctLink" data-i18n="nav_account">حسابي</a>
    <a href="index.html" class="btn-ghost" style="padding:10px 18px;font-size:.85rem" data-i18n="back">رجوع للمتجر</a>
  </div>
</header>

<main class="shell" id="page">
  <div class="checkout" id="checkout" hidden>

    <!-- ─────────────── left: the flow ─────────────── -->
    <div>
      <div class="stepper" id="stepper">
        <div class="node" id="s1"><i></i></div>
        <div class="node" id="s2"><i></i></div>
        <div class="node" id="s3"><i></i></div>
      </div>

      <!-- product header -->
      <div class="panel" data-reveal="0" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div style="inline-size:76px;block-size:76px;border-radius:20px;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;background:var(--surface-2);font-size:2rem"
             id="pImgWrap"></div>
        <div style="flex:1;min-inline-size:180px">
          <h1 style="font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin:0 0 5px" id="pName"></h1>
          <p style="color:var(--ink-dim);font-size:.9rem;margin:0" id="pDesc"></p>
        </div>
      </div>

      <!-- step 1 · packages -->
      <div class="panel" data-reveal="1">
        <div class="panel-title"><span class="step-num">1</span><span data-i18n="step_pkg">اختر الحزمة</span></div>
        <div class="pkg-grid" id="pkgGrid"></div>
      </div>

      <!-- step 2 · customer field -->
      <div class="reveal-step" id="stepInfo">
        <div class="panel" style="margin-block-start:20px">
          <div class="panel-title"><span class="step-num">2</span><span data-i18n="step_info">بياناتك</span></div>
          <!-- Signed-in customers get this filled in and locked -->
          <div id="acctBanner" class="acct-banner" hidden>
            <span class="tick">✓</span>
            <span><b data-i18n="checkout_as">الطلب باسم</b> <span id="acctWho"></span></span>
          </div>

          <div class="form-2col" id="guestFields">
            <div class="field" id="nameField">
              <label for="custName" data-i18n="full_name">الاسم الكامل</label>
              <input id="custName" type="text" data-i18n-ph="name_ph" autocomplete="name">
              <span class="err" id="nameErr"></span>
            </div>
            <div class="field" id="emailField">
              <label for="custEmail" data-i18n="email">البريد الإلكتروني</label>
              <input id="custEmail" type="email" data-i18n-ph="email_ph" autocomplete="email">
              <span class="err" id="emailErr"></span>
            </div>
          </div>

          <p class="hint-line" id="trackHint">
            <a href="account.html" data-i18n="track_note">أنشئ حساباً لتتبع حالة طلباتك</a>
          </p>

          <div class="field" id="refField">
            <label for="customerRef" id="refLabel"></label>
            <input id="customerRef" type="text" autocomplete="off">
            <span class="err" id="refErr"></span>
          </div>
          <div class="field">
            <label for="contact" data-i18n="contact_label">رقم للتواصل (اختياري)</label>
            <input id="contact" type="text" data-i18n-ph="contact_ph" autocomplete="off">
          </div>
        </div>
      </div>

      <!-- step 3 · payment -->
      <div class="reveal-step" id="stepPay">
        <div class="panel" style="margin-block-start:20px">
          <div class="panel-title"><span class="step-num">3</span><span data-i18n="step_pay">الدفع وتأكيد الطلب</span></div>

          <div class="method-tabs" id="methodTabs"></div>
          <div id="methodBody"></div>

          <div class="field" style="margin-block-start:22px">
            <label for="receipt" data-i18n="receipt_label">أدخل رقم إيصال التحويل</label>
            <input id="receipt" type="text" data-i18n-ph="receipt_ph" autocomplete="off">
            <span class="err" id="receiptErr"></span>
          </div>

          <p style="font-size:.83rem;color:var(--warn);margin:0" id="checkoutNote"></p>
        </div>
      </div>
    </div>

    <!-- ─────────────── right: summary ─────────────── -->
    <aside class="summary">
      <div class="panel" data-reveal="2">
        <div class="panel-title" style="margin-block-end:8px">🧾 <span data-i18n="summary">ملخص الطلب</span></div>

        <div class="summary-row"><span data-i18n="product">المنتج</span><b id="sumProduct">—</b></div>
        <div class="summary-row"><span data-i18n="package">الحزمة</span><b id="sumPkg">—</b></div>
        <div class="summary-row"><span data-i18n="method">طريقة الدفع</span><b id="sumMethod">—</b></div>

        <div class="summary-total">
          <span style="color:var(--ink-faint);font-size:.88rem" data-i18n="total">الإجمالي</span>
          <span class="amt" id="sumTotal">—</span>
        </div>

        <button class="btn-glow" id="submitBtn" style="inline-size:100%;margin-block-start:20px" disabled>
          <span data-i18n="confirm">لقد قمت بالتحويل — تأكيد الطلب</span>
        </button>

        <div class="trust">
          <div><span class="tick">✓</span><span data-i18n="trust_1">تسليم خلال دقائق</span></div>
          <div><span class="tick">✓</span><span data-i18n="trust_2">معاملات آمنة ومشفّرة</span></div>
          <div><span class="tick">✓</span><span data-i18n="trust_3">دعم فني على مدار الساعة</span></div>
        </div>
      </div>
    </aside>
  </div>

  <div id="loader" style="padding:80px 0"><div class="skeleton" style="block-size:420px"></div></div>
</main>

<!-- ─────────────── success overlay ─────────────── -->
<div class="success-veil" id="veil">
  <div class="success-card">
    <svg class="tick-ring" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="26"/>
      <path d="M18 31.5 L26.5 40 L42 22"/>
    </svg>
    <h3 id="okTitle"></h3>
    <div class="order-code" id="okCode"></div>
    <p id="okBody"></p>
    <a href="index.html" class="btn-glow" data-i18n="done">تمام، شكراً!</a>
  </div>
</div>

<script src="assets/js/config.js?v=12"></script>
<script src="assets/js/api.js?v=12"></script>
<script src="assets/js/i18n.js?v=12"></script>
<script src="assets/js/motion.js?v=12"></script>
<script src="assets/js/product.js?v=12"></script>
</body>
</html>
